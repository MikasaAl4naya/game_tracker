services:
  # 1. База данных (доступна только внутри Docker-сети)
  db:
    image: postgres:15-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # 2. Redis (доступен только внутри Docker-сети)
  redis:
    image: redis:7-alpine
    restart: always

  # 3. RabbitMQ — управление доступно только локально, брокер внутри
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "127.0.0.1:15672:15672"
    restart: always

  # 4. Веб-сервер FastAPI
  web:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8080:8000"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  # 5. Celery воркер (парсеры)
  worker:
    build: .
    command: celery -A worker worker --concurrency=3 --loglevel=info
    env_file: .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - rabbitmq
      - redis
      - db
    volumes:
      - .:/app

  # 6. Celery Beat (планировщик регулярных обновлений цен и каталога)
  beat:
    build: .
    command: celery -A worker beat --loglevel=INFO
    env_file: .env
    depends_on:
      - rabbitmq
      - redis
      - db
    volumes:
      - .:/app

  # 7. Flower (мониторинг Celery, доступен только локально)
  flower:
    build: .
    command: celery -A worker flower --port=5555
    env_file: .env
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - rabbitmq
      - redis
      - worker

  # 8. Telegram-бот (отслеживание цен и мгновенные уведомления 24/7)
  bot:
    build: .
    command: python bot.py
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    restart: always

volumes:
  postgres_data:
